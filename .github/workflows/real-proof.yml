name: Real proof (RISC0_DEV_MODE=0, public testnet)

# The shielded leg of funding — a real RISC0 STARK for the public → private transfer — needs ~16 GB
# of RAM. A hosted runner for a public repo has 4 vCPU / 16 GB, which is exactly why this job is
# separate from ci.yml's E2E (public rail, no client proof, runs on every push). Run it by hand
# (Actions → Real proof → Run workflow); it takes 1–4 h and every step is asserted by ./demo.sh in
# strict mode, ending with the chain showing the agent's public account down by 100 and its
# private account funded. The demo log is kept as an artifact: that log, with the r0vm proving
# output in it, is the RISC0_DEV_MODE=0 evidence.
on:
  workflow_dispatch:
    inputs:
      segment_po2:
        description: "RISC0_SEGMENT_PO2 (lower = less RAM, more time)"
        default: "18"
        required: false

jobs:
  real-proof:
    name: Fund + spend with a real proof (./demo.sh, REQUIRE_SHIELDED=1)
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the hosted-runner cap is 6 h

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Fetch runtime (logoscore) + installer (lgpm) from Cachix
        run: |
          LS_PATH=/nix/store/l2c4m1mn6lcy6crj1azbv63dmsndir7a-logos-logoscore-cli-bin-0.1.0
          LGPM_PATH=/nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0
          nix-store -r "$LS_PATH" "$LGPM_PATH"
          ln -sfn "$LS_PATH" result-logoscore
          ln -sfn "$LGPM_PATH" result-lgpm

      # r0vm is the RISC0 prover binary the wallet shells out to for a real proof. The version
      # must match the circuits the pinned wallet module was built against (risc0 3.0.5 for
      # logos-blockchain-circuits 0.5.x — the same pairing the development box uses).
      - name: Install the RISC0 prover (r0vm 3.0.5)
        run: |
          curl -L https://risczero.com/install | bash
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install r0vm 3.0.5 || rzup install cargo-risczero 3.0.5
          R0="$(ls -d "$HOME"/.risc0/extensions/*cargo-risczero* 2>/dev/null | head -1)"
          echo "R0VM_DIR=$R0" >> "$GITHUB_ENV"
          echo "$R0" >> "$GITHUB_PATH"
          "$R0/r0vm" --version || (echo "r0vm not runnable" && exit 1)

      - name: Run ./demo.sh with real proofs (strict: the shielded leg must land on chain)
        env:
          LOGOSCORE_BIN: ${{ github.workspace }}/result-logoscore/bin/logoscore
          LGPM_BIN: ${{ github.workspace }}/result-lgpm/bin/lgpm
          LEZ_RPC: https://testnet.lez.logos.co
          RISC0_DEV_MODE: "0"
          RISC0_SEGMENT_PO2: ${{ github.event.inputs.segment_po2 }}
          RISC0_INFO: "1"                 # cycle counts in the log: the hardware-independent CU figure
          REQUIRE_SHIELDED: "1"
          PILOT_TX_TIMEOUT_MS: "14400000"  # 4 h ceiling on the wallet call that carries the proof
          SHIELDED_TIMEOUT_SECS: "16200"
          DEMO_AMOUNT: "1"
        run: ./demo.sh 2>&1 | tee real-proof-demo.log

      - name: Keep the log as evidence (r0vm output = RISC0_DEV_MODE=0 proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-proof-demo-log
          path: real-proof-demo.log
          if-no-files-found: ignore
