name: Owner channel from a separate app

# LP-0008: "The owner can interact with the agent in real time from a separate Logos app instance
# using Logos Messaging, with no intermediary server." agents/owner-channel.sh runs one agent
# (fresh identity, funded on the public testnet) and the owner client pilot-owner as a separate
# program that shares nothing with the agent but a Waku relay: /balance answered, a held 101-LEZ
# spend announced to the owner and approved from the client, the spend read back from the chain.
# Manual trigger; ~30 min and one faucet claim.
on:
  workflow_dispatch:

jobs:
  owner-channel:
    name: owner client <-> agent over the relay (public LEZ testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Fetch runtime (logoscore) + installer (lgpm) from Cachix
        shell: bash
        run: |
          LS_PATH=/nix/store/l2c4m1mn6lcy6crj1azbv63dmsndir7a-logos-logoscore-cli-bin-0.1.0
          LGPM_PATH=/nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0
          nix-store -r "$LS_PATH" "$LGPM_PATH"
          ln -sfn "$LS_PATH" result-logoscore
          ln -sfn "$LGPM_PATH" result-lgpm

      - name: "Owner client <-> agent over the relay (every step asserted)"
        env:
          LOGOSCORE_BIN: ${{ github.workspace }}/result-logoscore/bin/logoscore
          LGPM_BIN: ${{ github.workspace }}/result-lgpm/bin/lgpm
          LEZ_RPC: https://testnet.lez.logos.co
          RISC0_DEV_MODE: "1"
        shell: bash
        run: |
          mkdir -p agents/out/owner
          bash agents/owner-channel.sh 2>&1 | tee agents/out/owner/run.log

      - name: Keep the evidence (run log, daemon log, the agent's card, the client's transcript)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-channel
          path: agents/out/owner/
          if-no-files-found: ignore
