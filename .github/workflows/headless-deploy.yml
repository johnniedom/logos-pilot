name: Headless deploy on a fresh runner

# LP-0008: "Deploy and configure with a single headless CLI command." agents/headless-deploy.sh runs
# `pilot deploy --testnet` on a runner that has never seen the agent, with an EMPTY modules directory:
# the deploy has to install the four modules itself, create the identity, and leave a daemon that
# funds itself from the public testnet's faucet; the owner then reads its balances from the separate
# pilot-owner client over the relay. Manual trigger; ~35 min and one faucet claim.
on:
  workflow_dispatch:

jobs:
  headless-deploy:
    name: pilot deploy --testnet, no keystrokes, empty modules dir
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Fetch runtime (logoscore) + installer (lgpm) from Cachix
        shell: bash
        run: |
          LS_PATH=/nix/store/l2c4m1mn6lcy6crj1azbv63dmsndir7a-logos-logoscore-cli-bin-0.1.0
          LGPM_PATH=/nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0
          nix-store -r "$LS_PATH" "$LGPM_PATH"
          ln -sfn "$LS_PATH" result-logoscore
          ln -sfn "$LGPM_PATH" result-lgpm

      - name: "pilot deploy --testnet on a fresh runner (every step asserted)"
        env:
          LOGOSCORE_BIN: ${{ github.workspace }}/result-logoscore/bin/logoscore
          LGPM_BIN: ${{ github.workspace }}/result-lgpm/bin/lgpm
          LEZ_RPC: https://testnet.lez.logos.co
        shell: bash
        run: |
          mkdir -p agents/out/headless
          bash agents/headless-deploy.sh 2>&1 | tee agents/out/headless/run.log

      - name: Keep the evidence (run log, deploy output, status, daemon log, card, owner transcript)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-deploy
          path: agents/out/headless/
          if-no-files-found: ignore
