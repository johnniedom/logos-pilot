name: Testnet use cases (alerter, marketplace)

# LP-0008 F9: "at least 3 of the illustrative use cases are demonstrated end-to-end on LEZ testnet."
# The personal file vault runs in every CI demo (and the storage agent adds sharing with a second
# identity). These two jobs run the other two on the two-agent scaffold of agents/deploy-agent.sh
# from a clean clone on hosted runners, against the public testnet, every step asserted:
#   alerter      on-chain event alerter — A watches B's public account through the wallet module, B
#                spends, A sees the change and alerts B over Logos Messaging, B reads the alert
#   marketplace  paid skill marketplace with REAL proofs — A's private account is funded by a real
#                shielded proof, B sells agent.ask, A discovers B's card, buys, and pays B's declared
#                price over the private rail; the payment is read back from the chain (~2 h, 16 GB)
# Manual only: the marketplace job burns ~2 h of runner time and two faucet claims.
on:
  workflow_dispatch:
    inputs:
      usecases:
        description: "Comma list of use cases to run (alerter,marketplace)"
        default: "alerter,marketplace"
        required: false
      segment_po2:
        description: "RISC0_SEGMENT_PO2 for the marketplace proofs (lower = less RAM, more time)"
        default: "18"
        required: false

jobs:
  usecase:
    name: ${{ matrix.role }} use case (public LEZ testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 330   # the hosted-runner cap is 6 h; the marketplace job needs two real proofs
    strategy:
      fail-fast: false
      matrix:
        role: [alerter, marketplace]
    steps:
      - uses: actions/checkout@v4

      - name: Skip use cases not requested
        id: want
        shell: bash
        run: |
          WANT="${{ github.event.inputs.usecases || 'alerter,marketplace' }}"
          if echo ",$WANT," | grep -q ",${{ matrix.role }},"; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi

      - name: Free disk space
        if: steps.want.outputs.run == '1'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        if: steps.want.outputs.run == '1'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2

      - uses: cachix/cachix-action@v15
        if: steps.want.outputs.run == '1'
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Fetch runtime (logoscore) + installer (lgpm) from Cachix
        if: steps.want.outputs.run == '1'
        shell: bash
        run: |
          LS_PATH=/nix/store/l2c4m1mn6lcy6crj1azbv63dmsndir7a-logos-logoscore-cli-bin-0.1.0
          LGPM_PATH=/nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0
          nix-store -r "$LS_PATH" "$LGPM_PATH"
          ln -sfn "$LS_PATH" result-logoscore
          ln -sfn "$LGPM_PATH" result-lgpm

      # The RISC0 prover the wallet shells out to for a real proof; version matched to the circuits
      # the pinned wallet module was built against (risc0 3.0.5 for logos-blockchain-circuits 0.5.x).
      - name: Install the RISC0 prover (r0vm 3.0.5) — marketplace only
        if: steps.want.outputs.run == '1' && matrix.role == 'marketplace'
        shell: bash
        run: |
          curl -L https://risczero.com/install | bash
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install r0vm 3.0.5 || rzup install cargo-risczero 3.0.5
          R0="$(ls -d "$HOME"/.risc0/extensions/*cargo-risczero* 2>/dev/null | head -1)"
          echo "$R0" >> "$GITHUB_PATH"
          "$R0/r0vm" --version || (echo "r0vm not runnable" && exit 1)

      - name: "Run the ${{ matrix.role }} use case against the public testnet (every step asserted)"
        if: steps.want.outputs.run == '1'
        env:
          LOGOSCORE_BIN: ${{ github.workspace }}/result-logoscore/bin/logoscore
          LGPM_BIN: ${{ github.workspace }}/result-lgpm/bin/lgpm
          LEZ_RPC: https://testnet.lez.logos.co
          RISC0_SEGMENT_PO2: ${{ github.event.inputs.segment_po2 || '18' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PILOT_LLM_MODEL: deepseek-v4-pro
        shell: bash   # bash -eo pipefail: a failing script must fail the job even through tee
        run: |
          mkdir -p agents/out/${{ matrix.role }}
          bash agents/deploy-agent.sh --role ${{ matrix.role }} 2>&1 | tee agents/out/${{ matrix.role }}/run.log

      - name: Keep the evidence (run log with EVIDENCE lines, daemon logs, inbox dumps)
        if: always() && steps.want.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: testnet-usecase-${{ matrix.role }}
          path: agents/out/${{ matrix.role }}/
          if-no-files-found: ignore
