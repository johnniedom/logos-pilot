name: Program operations (public LEZ testnet)

# The program.* skills through the wallet module on the public testnet: program.query reads a
# program account the chain names, program.call refuses to guess an ABI, program.deploy submits
# the wallet's built-in token program as a deployment transaction and reports the wallet's reply
# verbatim (a mined tx is verified on chain). Manual; ~25 min and one faucet claim.
on:
  workflow_dispatch:

jobs:
  program-ops:
    name: program.query / call / deploy through lez_core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Fetch runtime (logoscore) + installer (lgpm) from Cachix
        shell: bash
        run: |
          LS_PATH=/nix/store/l2c4m1mn6lcy6crj1azbv63dmsndir7a-logos-logoscore-cli-bin-0.1.0
          LGPM_PATH=/nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0
          nix-store -r "$LS_PATH" "$LGPM_PATH"
          ln -sfn "$LS_PATH" result-logoscore
          ln -sfn "$LGPM_PATH" result-lgpm

      - name: "Program operations against the public testnet (every module step asserted)"
        env:
          LOGOSCORE_BIN: ${{ github.workspace }}/result-logoscore/bin/logoscore
          LGPM_BIN: ${{ github.workspace }}/result-lgpm/bin/lgpm
          LEZ_RPC: https://testnet.lez.logos.co
          RISC0_DEV_MODE: "1"
        shell: bash
        run: |
          mkdir -p agents/out/programs
          bash agents/program-ops.sh 2>&1 | tee agents/out/programs/run.log

      - name: Keep the evidence (run log, daemon log, query and deploy replies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-ops
          path: agents/out/programs/
          if-no-files-found: ignore
