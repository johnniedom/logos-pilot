name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  build-module:
    name: Build C++ Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Build module
        run: cd pilot-module && nix build

      - name: Run unit tests (208 tests)
        run: cd pilot-module && nix build .#unit-tests -L

      - name: Build LGX package
        run: cd pilot-module && nix build .#lgx

  build-cli:
    name: Build Nim CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build CLI
        run: cd pilot-cli && nix build

      - name: Verify binary
        run: |
          pilot-cli/result/bin/pilot version
          pilot-cli/result/bin/pilot help

      # ~90 assertions on the daemon-reply seam (bool results, RPC-failure explanations,
      # sync hints, log tail). They existed since 2026-07 but never ran anywhere but a
      # dev shell — a wallet-crash explanation that matched only the OLD module name
      # sat unnoticed for a month because of that.
      - name: Run CLI tests (tests/test_rpc.nim)
        run: cd pilot-cli && nix develop -c nim c -r --hints:off --nimcache:/tmp/nimcache tests/test_rpc.nim

  # End-to-end proof on the PUBLIC LEZ testnet (spec line 122): runs the same ./demo.sh a judge
  # runs from a clean clone. Every step is asserted (see demo.sh): pilot + its 3 dependency
  # modules load in the real logoscore daemon, 23 skills, echo round-trip, the agent funds
  # ITSELF from the faucet, spends through its own spending FSM over the public rail, and the
  # transaction + balances are read back FROM THE CHAIN. The public rail needs no client-side
  # proof, so this runs on a hosted runner; the shielded leg (real RISC0 proof, ~16 GB RAM) is
  # reported by the demo, not asserted. Until 2026-09-04 this job booted a Docker devnet
  # sequencer on :8080 that the wallet never talked to and never called initialize.
  e2e:
    name: E2E (logoscore + public LEZ testnet via ./demo.sh)
    runs-on: ubuntu-latest
    needs: build-module
    timeout-minutes: 150   # a cold wallet replays the whole chain before it can fund (~1,000-3,000 blocks/min)
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Fetch runtime (logoscore) + installer (lgpm) from Cachix
        run: |
          # Pinned store paths, pushed from the dev box 2026-08-28. Building the
          # unpinned logos-logoscore-cli ref from source has killed three hosted
          # runners in a row (~60 min Qt build starves the 4-core VM until GitHub
          # pulls the plug); these are the exact closures the local test rig runs.
          LS_PATH=/nix/store/l2c4m1mn6lcy6crj1azbv63dmsndir7a-logos-logoscore-cli-bin-0.1.0
          LGPM_PATH=/nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0
          # nix-store -r, not nix copy --from: cachix skips deps that live on
          # cache.nixos.org (e.g. qtsvg), so a single-source copy dies on them;
          # realising goes through ALL configured substituters.
          nix-store -r "$LS_PATH" "$LGPM_PATH"
          ln -sfn "$LS_PATH" result-logoscore
          ln -sfn "$LGPM_PATH" result-lgpm

      - name: Run ./demo.sh against the public testnet (every step asserted; non-zero exit on any failure)
        env:
          LOGOSCORE_BIN: ${{ github.workspace }}/result-logoscore/bin/logoscore
          LGPM_BIN: ${{ github.workspace }}/result-lgpm/bin/lgpm
          LEZ_RPC: https://testnet.lez.logos.co
          RISC0_DEV_MODE: "1"     # the public rail needs no client proof; the shielded leg is reported, not asserted
          DEMO_AMOUNT: "1"
        shell: bash   # bash -eo pipefail: a failing demo must fail the job even through tee
        run: ./demo.sh 2>&1 | tee demo.log

      - name: Keep the demo log as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-demo-logs
          path: |
            demo.log
            demo-daemon.log
          if-no-files-found: ignore

      - name: Re-verify the committed testnet evidence against the chain
        run: bash evidence/verify-testnet.sh
