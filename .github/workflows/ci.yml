name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  build-module:
    name: Build C++ Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Build module
        run: cd pilot-module && nix build

      - name: Run unit tests (44 tests)
        run: cd pilot-module && nix build .#unit-tests -L

      - name: Build LGX package
        run: cd pilot-module && nix build .#lgx

  build-cli:
    name: Build Nim CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build CLI
        run: cd pilot-cli && nix build

      - name: Verify binary
        run: |
          pilot-cli/result/bin/pilot version
          pilot-cli/result/bin/pilot help

  # End-to-end integration test against a standalone LEZ sequencer (spec line 122).
  # Boots the prebuilt devnet sequencer, builds pilot + all 4 dependency modules
  # (pinned to flake.lock revs), installs them via lgpm, then loads pilot in the real
  # logoscore daemon and exercises its skills. Real on-chain funding/spending with
  # RISC0 proofs is validated manually (RUNBOOK.md) + the demo videos.
  e2e:
    name: E2E (logoscore + LEZ sequencer)
    runs-on: ubuntu-latest
    needs: build-module
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Boot standalone LEZ sequencer (devnet image)
        run: |
          docker run -d --name seq -p 8080:8080 \
            -e SEQUENCER_LISTEN_ADDR=0.0.0.0:8080 \
            -e SEQUENCER_DB_PATH=/data/sequencer.db \
            -e SEQUENCER_SIGNING_KEY_PATH=/data/sequencer.key \
            -e SEQUENCER_INITIAL_BALANCE=1000 \
            -e SEQUENCER_CHANNEL_ID=6d656d636f696e00000000000000000000000000000000000000000000000001 \
            -v seq-data:/data \
            --entrypoint /usr/bin/logos-blockchain-demo-sequencer \
            ghcr.io/logos-blockchain/logos-blockchain:devnet
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/8080) 2>/dev/null; then echo "sequencer listening on :8080"; break; fi
            sleep 5
          done

      - name: Fetch runtime (logoscore) + installer (lgpm) from Cachix
        run: |
          # Pinned store paths, pushed from the dev box 2026-08-28. Building the
          # unpinned logos-logoscore-cli ref from source has killed three hosted
          # runners in a row (~60 min Qt build starves the 4-core VM until GitHub
          # pulls the plug); these are the exact closures the local test rig runs.
          LS_PATH=/nix/store/l2c4m1mn6lcy6crj1azbv63dmsndir7a-logos-logoscore-cli-bin-0.1.0
          LGPM_PATH=/nix/store/l2kcbdg9hn7lb053lx111smrvi88jl38-logos-package-manager-cli-1.0.0
          # nix-store -r, not nix copy --from: cachix skips deps that live on
          # cache.nixos.org (e.g. qtsvg), so a single-source copy dies on them;
          # realising goes through ALL configured substituters.
          nix-store -r "$LS_PATH" "$LGPM_PATH"
          ln -sfn "$LS_PATH" result-logoscore
          ln -sfn "$LGPM_PATH" result-lgpm

      - name: Build module LGX packages (pilot + deps, pinned to flake.lock)
        run: |
          ( cd pilot-module && nix build .#lgx -o ../result-pilot-lgx )
          # Same revisions as pilot-module/flake.lock — the module is named lez_core now, and
          # metadata.json#dependencies is [lez_core, delivery_module, storage_module].
          nix build 'github:logos-blockchain/logos-execution-zone-module/24e09df2af5774cab3f83d2f521533abb7ddffdd#lgx' -o result-ez-lgx
          nix build 'github:logos-co/logos-delivery-module/3258cdb0132e37228aa2519e0c01c0e7429a20dd#lgx'   -o result-delivery-lgx
          nix build 'github:logos-co/logos-storage-module/7307910f0e5728e08c77820e21698e903c73d987#lgx'    -o result-storage-lgx
          nix build 'github:logos-co/logos-chat-module/dfe8ccf3eff3e95da0ba54043577270474a216ae#lgx'       -o result-chat-lgx

      - name: Install all modules via lgpm
        run: |
          MODS=/tmp/pilot/modules
          rm -rf "$MODS"; mkdir -p "$MODS"
          for f in result-pilot-lgx/*.lgx result-ez-lgx/*.lgx result-delivery-lgx/*.lgx \
                   result-storage-lgx/*.lgx result-chat-lgx/*.lgx; do
            result-lgpm/bin/lgpm install --file "$f" --modules-dir "$MODS" --allow-unsigned
          done
          ls "$MODS"

      - name: E2E — load pilot + deps and exercise skills (sequencer up)
        run: |
          export LOGOS_HOST_PATH=$(find /nix/store -maxdepth 1 -name "*-logos-liblogos" -type d | head -1)/bin/logos_host
          LS=result-logoscore/bin/logoscore
          "$LS" -D -m /tmp/pilot/modules &
          sleep 8

          load=$("$LS" load-module pilot 2>&1); echo "load: $load"
          echo "$load" | grep -q '"status":"ok"'        || { echo "E2E FAIL: pilot did not load"; "$LS" stop || true; exit 1; }
          # No dependencies_loaded assert: the pinned CLI has the deps loaded before pilot,
          # so pilot's load correctly reports [] — the echo + 23-skills calls below are the
          # real dependency exercise (they die if lez_core/storage/delivery are absent).

          eo=$("$LS" call pilot echo "ci-e2e" 2>&1); echo "echo: $eo"
          echo "$eo" | grep -q 'echo: ci-e2e'           || { echo "E2E FAIL: echo round-trip"; "$LS" stop || true; exit 1; }

          sk=$("$LS" call pilot metaSkills 2>&1); echo "skills(head): ${sk:0:140}"
          echo "$sk" | grep -qE 'count[^0-9]*23'        || { echo "E2E FAIL: expected 23 skills"; "$LS" stop || true; exit 1; }

          # Informational: probe the wallet against the sequencer (non-fatal — real
          # funding/spending with proofs is the manual/video path).
          echo "wallet probe: $("$LS" call pilot metaStatus 2>&1 | head -c 200)" || true

          "$LS" stop || true
          docker rm -f seq >/dev/null 2>&1 || true
          echo "E2E OK: LEZ sequencer up; pilot + 4 deps loaded in logoscore; 23 skills; echo round-trip"
