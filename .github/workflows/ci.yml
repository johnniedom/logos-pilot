name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  build-module:
    name: Build C++ Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Build module
        run: cd pilot-module && nix build

      - name: Run unit tests (44 tests)
        run: cd pilot-module && nix build .#unit-tests -L

      - name: Build LGX package
        run: cd pilot-module && nix build .#lgx

  build-cli:
    name: Build Nim CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build CLI
        run: cd pilot-cli && nix build

      - name: Verify binary
        run: |
          pilot-cli/result/bin/pilot version
          pilot-cli/result/bin/pilot help

  # NOTE: a headless logoscore E2E job was removed. The current logoscore replaced
  # inline `-c` calls with daemon+subcommands AND a real method call needs pilot's
  # companion modules (logos_execution_zone, delivery_module, storage_module,
  # chat_module) plus the LEZ sequencer + RISC0 — none of which CI provides. The
  # full runtime is validated manually (see RUNBOOK.md) and in the demo videos.
  # CI proves the build + the 55 unit tests, which cover the skill registry, the
  # spending FSM, crypto, and the inbound A2A task lifecycle.
