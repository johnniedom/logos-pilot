name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  build-module:
    name: Build C++ Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Build module
        run: cd pilot-module && nix build

      - name: Run unit tests (44 tests)
        run: cd pilot-module && nix build .#unit-tests -L

      - name: Build LGX package
        run: cd pilot-module && nix build .#lgx

  build-cli:
    name: Build Nim CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build CLI
        run: cd pilot-cli && nix build

      - name: Verify binary
        run: |
          pilot-cli/result/bin/pilot version
          pilot-cli/result/bin/pilot help

  e2e:
    name: E2E (headless logoscore)
    runs-on: ubuntu-latest
    needs: build-module
    steps:
      - uses: actions/checkout@v4

      # The wallet (Rust) + RISC0 build needs far more than the runner's ~14 GB.
      # Reclaim ~25-30 GB by dropping preinstalled toolchains we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-pilot-johnniedom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      # Headless runtime that loads modules as real plugins (see CLAUDE.md).
      - name: Build logoscore CLI
        run: nix build 'github:logos-co/logos-logoscore-cli' -o result-logoscore

      - name: Package pilot as an LGX
        run: cd pilot-module && nix build .#lgx -o result-lgx

      - name: Install module via lgpm
        run: |
          cd pilot-module
          LGPM=$(find /nix/store -maxdepth 3 -name lgpm -path "*/bin/*" | head -1)
          "$LGPM" install --file result-lgx/logos-pilot-module-lib.lgx \
            --modules-dir /tmp/pilot/modules --allow-unsigned

      # logoscore's inline `-c` call mode was removed upstream (it is now daemon +
      # subcommands), and a real method call needs pilot's companion modules
      # (logos_execution_zone, delivery_module, storage_module, chat_module) plus the
      # LEZ stack + RISC0 — validated manually, not in CI (see RUNBOOK.md). So CI
      # verifies the achievable integration: the packaged plugin installs and the real
      # runtime recognizes it as a known module. Skill registration + the echo
      # round-trip are covered by the unit tests (nix build .#unit-tests).
      - name: Run headless E2E (runtime recognizes the module)
        run: |
          export LOGOS_HOST_PATH=$(find /nix/store -maxdepth 1 -name "*-logos-liblogos" -type d | head -1)/bin/logos_host
          LS=./result-logoscore/bin/logoscore
          "$LS" -D -m /tmp/pilot/modules &
          sleep 6
          mods=$("$LS" list-modules 2>&1 || true)
          echo "$mods"
          "$LS" stop 2>/dev/null || true
          echo "$mods" | grep -q '"name":"pilot"' \
            || { echo "E2E FAIL: pilot not recognized by logoscore runtime"; exit 1; }
          echo "E2E OK: pilot LGX installed and recognized as a known module by logoscore"
